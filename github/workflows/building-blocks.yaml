name: building blocks
on: push
jobs:
  build:
   echo-hello:
    runs-on: ubuntu-latest
    steps:
      - name: say hello
        run: echo "Hello, World!"
  echo-goodbye:
    runs-on: ubuntu-latest
    steps:
      - name: failed step
        run: |
          echo "this step will fail"
          exit 1
      - name: say goodbye
        run: echo "Goodbye, World!"
        
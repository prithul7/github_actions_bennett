name: System Report

on:
  push:

jobs:
  system-info:
    runs-on: ubuntu-latest

    steps:
      - name: Print OS name and kernel version
        run: |
          echo "OS Name:"
          uname -o
          echo "Kernel Version:"
          uname -r

      - name: Print free disk space
        run: df -h

      - name: Print current date and time
        run: date

      - name: Install tree
        run: |
          sudo apt-get update
          sudo apt-get install -y tree

      - name: Display home directory structure
        run: tree -L 2 ~

  tool-check:
    runs-on: ubuntu-latest

    steps:
      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Create report.json
        run: |
          cat > report.json <<EOF
          {
            "project": "System Report",
            "environment": "GitHub Actions",
            "status": "success"
          }
          EOF

      - name: Read value using jq
        run: jq -r '.project' report.json

      - name: Print tool versions
        run: |
          python3 --version
          git --version
          jq --version

      - name: Finish report
        run: echo "Report complete"